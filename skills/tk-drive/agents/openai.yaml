interface:
  short_description: "[user] 승인된 direct 또는 fresh-worker 변경 실행을 진행한다."
  default_prompt: "$tk-drive와 명시적 source를 사용해 하나의 approval surface를 준비하고, bounded unit은 direct로 실행하며 필요한 delegated unit만 approved session model routing의 fresh implementer/reviewer로 처리한 뒤 R/AC gap, verified unit commit, finalization까지 완료한다."

policy:
  allow_implicit_invocation: false
