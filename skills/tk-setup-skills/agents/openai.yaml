interface:
  short_description: "[user] TigerKit 설치 상태를 확인하고 필요한 설정을 추천합니다."
  default_prompt: "인자 없이 호출되어도 읽기 전용으로 현재 호스트·설치 상태를 먼저 확인하세요. 목적이 불명확할 때만 환경 점검·스킬 설치/업데이트·공통 지침·사용법 중 쉬운 선택지를 추천과 함께 묻습니다. 질문 직전에 tk-questioning 기준을 읽으세요. 스킬 ID·revision·경로 등 확인 가능한 기술 정보는 직접 조사하세요. 설치·설정 변경 전에는 구체적인 대상·계획을 보여 주고 별도 승인을 받으세요."

policy:
  allow_implicit_invocation: false
