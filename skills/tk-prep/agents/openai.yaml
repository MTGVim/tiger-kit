interface:
  short_description: "[user/auto] 오류의 원인을 읽기 전용으로 진단하거나 승인된 SWE 구현까지 수행합니다."
  default_prompt: "`tk-prep`으로 요청을 분류하세요. 오류의 원인만 묻는다면 `references/debug.md`에 따라 읽기 전용으로 진단·보고하고 종료하세요. 구현 요청이면 작업 원천과 저장소 근거를 조사하고 필요한 결정만 닫으세요. 이해·엔지니어링·테스트 준비도와 승인 경계를 확인한 뒤 적절한 실행 형태를 선택하고, 승인된 경우에만 안전한 로컬 구현·검증·`commit`까지 수행하세요. 원격 발행은 확장하지 마세요."

policy:
  allow_implicit_invocation: true
