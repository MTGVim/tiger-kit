interface:
  short_description: "[user] 복잡한 비즈니스 정책 분기를 찾아 최소 충분한 리팩터링 구조를 제안합니다."
  default_prompt: "`tk-refactor-policy`로 지정한 저장소 범위의 비즈니스 정책성 조건 분기를 읽기 전용으로 조사하세요. 일반 제어 흐름과 정책을 구분하고, 현재 유지 → 명명된 predicate → predicate combinator → Specification → Decision Table → Rules Engine/Policy-as-Code 순으로 최소 충분한 구조를 선택하세요. 동작 보존과 설명 가능성, 테스트 근거를 함께 제시하고 파일은 수정하지 마세요."

policy:
  allow_implicit_invocation: false
