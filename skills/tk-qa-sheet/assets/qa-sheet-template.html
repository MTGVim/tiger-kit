  - storageKey: 작업 단위로 고유하게 (예: "<task>-<topic>"). 바꾸면 이전 체크와 메모를 읽지 않는다.

  - criterionId: 영향 인벤토리와 verifier가 공유하는 안정적인 행 ID (새 행 필수)
  - verification: "manual"(기본) | "verification-gap" | "auto-verified" | "partial" | "failed"
  - auto-verified/partial/failed 는 evidence: {"ref":"run id 또는 evidence path","head":"근거가 묶인 head"} 를 가진다.
  - verification-gap 은 criterionId가 있는 자동 검증 대기 행이며 수동 체크박스가 없다. 새 manual 행은 manualReason/unblock, 데이터·도구 한계라면 searchScope도 가진다.

(() => {
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");

  const object = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
  const nonblank = (v) => typeof v === "string" && v.trim().length > 0;
  const strings = (v) => v === undefined || (Array.isArray(v) && v.every((s) => typeof s === "string"));
  const provenance = (v) => v === undefined || v === "observed" || v === "code-only";
  const verification = (v) => v === undefined || v === "manual" || v === "verification-gap" || v === "auto-verified" || v === "partial" || v === "failed";
  const manualReasons = new Set(["unauthorized-or-irreversible", "data-unavailable-after-search", "verified-capability-gap"]);
  const evidence = (v) => object(v) && nonblank(v.ref) && nonblank(v.head);
  const manualDetails = (v) => {
    if (v.manualReason === undefined) return v.searchScope === undefined && v.unblock === undefined;
    if (!manualReasons.has(v.manualReason) || !nonblank(v.unblock)) return false;
    return !["data-unavailable-after-search", "verified-capability-gap"].includes(v.manualReason) || nonblank(v.searchScope);
  };
  const criterionIds = new Set();
  const criterionId = (v) => {
    if (v === undefined) return true;
    if (!nonblank(v) || criterionIds.has(v)) return false;
    criterionIds.add(v);
    return true;
  };
  const validVerification = (v) => {
    if (!verification(v.verification)) return false;
    if (v.automatable !== undefined && typeof v.automatable !== "boolean") return false;
    const mode = v.verification || "manual";
    if (mode === "manual") {
      return (v.automatable === undefined || typeof v.automatable === "boolean")
        && v.evidence === undefined && (v.previousEvidence === undefined || evidence(v.previousEvidence))
        && manualDetails(v);
    }
    if (mode === "verification-gap") return nonblank(v.criterionId) && v.evidence === undefined
      && v.previousEvidence === undefined && v.manualReason === undefined && v.searchScope === undefined
      && v.unblock === undefined && v.automatable !== false;
    if (v.automatable !== undefined || v.manualReason !== undefined || v.searchScope !== undefined || v.unblock !== undefined) return false;
    return v.previousEvidence === undefined && evidence(v.evidence);
  };
  const safeUrl = (v) => {
    if (!nonblank(v) || !/^https?:\/\//.test(v)) return false;
    try { const u = new URL(v); return !u.username && !u.password; } catch { return false; }
  };
  const validCheck = (c) => object(c) && nonblank(c.text) && provenance(c.provenance)
    && criterionId(c.criterionId)
    && (c.heading === undefined || typeof c.heading === "boolean")
    && (c.indent === undefined || (Number.isInteger(c.indent) && c.indent >= 0 && c.indent <= 3))
    && (c.heading ? c.criterionId === undefined && c.verification === undefined && c.evidence === undefined && c.previousEvidence === undefined : validVerification(c));
  const validItem = (it) => {
    if (!object(it) || !nonblank(it.title) || !provenance(it.provenance) || !strings(it.notes)) return false;
    if (it.checks !== undefined && (!Array.isArray(it.checks) || !it.checks.every(validCheck))) return false;
    const children = Array.isArray(it.checks) && it.checks.length > 0;
    if (!criterionId(it.criterionId) || (children && it.criterionId !== undefined)) return false;
    if (children && !it.checks.some((c) => !c.heading)) return false;

      ? it.verification === undefined && it.evidence === undefined && it.previousEvidence === undefined
      : validVerification(it);

  const validData = (d) => object(d) && nonblank(d.title) && nonblank(d.storageKey)
    && (d.head === undefined || nonblank(d.head)) && strings(d.legend)
    && (d.environment === undefined || (object(d.environment) && nonblank(d.environment.label) && safeUrl(d.environment.baseUrl)))
    && Array.isArray(d.groups) && d.groups.length > 0 && d.groups.every((g) => object(g)

  const KEY = storageKey("checks"), NOTES = storageKey("notes"), ONLY = storageKey("onlyOpen");
  const read = (k, f) => { try { const v = localStorage.getItem(k); return v === null ? f : JSON.parse(v); } catch { return f; } };

    }
  };

  document.title = data.title;
  document.getElementById("title").textContent = data.title;
  if (data.environment) {
    const environment = document.getElementById("environment");
    environment.textContent = `환경: ${data.environment.label} (${data.environment.baseUrl})`;
    environment.hidden = false;
  }

    ? `<a class="screen-link" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">화면 열기</a>` : "";
  const checkId = (group, item, text = null) => "i" + encodeURIComponent(JSON.stringify([
    data.environment ? new URL(data.environment.baseUrl).href : null,
    item.url ? new URL(item.url).href : null, group.title, item.title, text,

  const seen = new Set();
  const verificationMode = (v) => v || "manual";
  const evidenceHtml = (value, label = "근거") => value
    ? `<span class="evidence">${label}: <code>${esc(value.ref)}</code> @ <code class="ht-token">${esc(value.head)}</code></span>`
    : "";
  const criterionHtml = value => value ? `<code class="criterion-id">${esc(value)}</code>` : "";
  const checkLi = (id, text, prov, indent, mode = "manual", evidenceValue, previousEvidenceValue, criterionValue, row = {}) => {
    if (seen.has(id)) throw new Error("체크 항목 ID가 중복됩니다. 항목을 구별할 화면과 조건을 추가해 주세요.");
    seen.add(id);
    const provenanceBadge = prov !== "observed" ? '<span class="badge">코드 기준</span>' : "";
    const verificationBadge = mode === "auto-verified"
      ? '<span class="badge auto">자동 검증</span>'
      : mode === "verification-gap"
        ? '<span class="badge gap">자동 검증 필요</span>'
      : mode === "partial"
        ? '<span class="badge partial">부분 자동 확인</span>'
        : mode === "failed"
          ? '<span class="badge failed">자동 실패</span>'
          : previousEvidenceValue ? '<span class="badge demoted">이전 head 검증</span>' : "";
    const auto = mode === "auto-verified";
    const attrs = auto ? ' checked disabled data-auto="true"' : "";
    const classes = auto ? " checked auto-verified" : mode === "partial" ? " partial" : "";
    if (mode === "verification-gap") return `<li class="check verification-gap lv${Math.min(indent || 0, 3)}"><div><span class="ctext">${fmt(text)}</span>${criterionHtml(criterionValue)}${provenanceBadge}${verificationBadge}</div></li>`;
    const manualReasonLabels = { "unauthorized-or-irreversible": "권한 없음 또는 되돌릴 수 없는 쓰기", "data-unavailable-after-search": "검색 후에도 데이터를 찾지 못함", "verified-capability-gap": "실제 시도에서 도구 한계 확인" };
    const manualInfo = mode === "manual" && row.manualReason
      ? `<span class="manual-detail">이유: ${esc(manualReasonLabels[row.manualReason])}</span>${row.searchScope ? `<span class="manual-detail">탐색·시도 범위: ${fmt(row.searchScope)}</span>` : ""}<span class="manual-detail">해제 방법: ${fmt(row.unblock)}</span>`
      : "";
    const automatableBadge = mode === "manual" && row.automatable === true ? '<span class="badge gap">요청된 체크리스트 · 자동화 가능</span>' : "";
    return `<li class="check${classes} lv${Math.min(indent || 0, 3)}"><label><input type="checkbox" data-id="${id}"${attrs}><span class="ctext">${fmt(text)}</span>${criterionHtml(criterionValue)}${provenanceBadge}${verificationBadge}${automatableBadge}${evidenceHtml(evidenceValue)}${evidenceHtml(previousEvidenceValue, "이전 근거")}</label>${manualInfo}</li>`;
  };
  const modeMatches = (mode, bucket) => bucket === "automated" ? mode === "auto-verified"
    : bucket === "gap" ? mode === "verification-gap" : mode !== "auto-verified" && mode !== "verification-gap";
  const renderItem = (g, it, bucket) => {
    if (!it.checks || !it.checks.length) {
      const mode = verificationMode(it.verification);
      if (!modeMatches(mode, bucket)) return "";
      let row = `<li><ul class="checks">${checkLi(checkId(g, it), it.title, it.provenance, 0, mode, it.evidence, it.previousEvidence, it.criterionId, it)}</ul>`;
      row += screenLink(it);
      if (it.notes && it.notes.length) row += `<ul class="notes">${it.notes.map((n) => `<li>${fmt(n)}</li>`).join("")}</ul>`;
      return row + "</li>";
    }
    const matching = it.checks.filter((c) => !c.heading && modeMatches(verificationMode(c.verification), bucket));
    if (!matching.length) return "";
    let row = `<li><div class="ititle">${fmt(it.title)}${screenLink(it)}</div>`;
    if (it.notes && it.notes.length) row += `<ul class="notes">${it.notes.map((n) => `<li>${fmt(n)}</li>`).join("")}</ul>`;
    row += '<ul class="checks">';
    for (const c of it.checks) {
      if (c.heading) {
        row += `<li class="subhead lv${Math.min(c.indent || 0, 3)}">${fmt(c.text)}</li>`;
        continue;
      }
      const mode = verificationMode(c.verification);
      if (!modeMatches(mode, bucket)) continue;
      row += checkLi(checkId(g, it, c.text), c.text,
        it.provenance === "observed" && c.provenance === "observed" ? "observed" : "code-only",
        c.indent, mode, c.evidence, c.previousEvidence, c.criterionId, c);
    }
    return row + "</ul></li>";
  };

  let html = "";
  try {
    if (data.legend && data.legend.length) {
      html += `<details class="legend"><summary>표기 규칙과 영향 범위</summary><ul>${data.legend.map((l) => `<li>${fmt(l)}</li>`).join("")}</ul></details>`;
    }

    let automated = "", automatedCount = 0;
    for (const g of data.groups) {
      const items = g.items.map((it) => renderItem(g, it, "automated")).filter(Boolean);
      if (!items.length) continue;
      automatedCount += g.items.reduce((count, it) => {
        if (!it.checks || !it.checks.length) return count + (verificationMode(it.verification) === "auto-verified" ? 1 : 0);
        return count + it.checks.filter((c) => !c.heading && verificationMode(c.verification) === "auto-verified").length;
      }, 0);
      automated += `<section class="group"><h2>${fmt(g.title)} <span class="gcount"></span></h2><ul class="items">${items.join("")}</ul></section>`;
    }
    if (automatedCount) {
      html += `<details class="automated"><summary>Automated <span class="gcount">${automatedCount} auto-verified</span></summary>${automated}</details>`;
    }

    const gapCount = data.groups.reduce((count, g) => count + g.items.reduce((subtotal, it) => {
      if (!it.checks || !it.checks.length) return subtotal + (verificationMode(it.verification) === "verification-gap" ? 1 : 0);
      return subtotal + it.checks.filter((c) => !c.heading && verificationMode(c.verification) === "verification-gap").length;
    }, 0), 0);
    if (gapCount) {
      let gaps = "";
      for (const g of data.groups) {
        const items = g.items.map((it) => renderItem(g, it, "gap")).filter(Boolean);
        if (items.length) gaps += `<section class="gap-group"><h3>${fmt(g.title)}</h3><ul class="items">${items.join("")}</ul></section>`;
      }
      html += `<section class="verification-gaps"><h2>자동 검증 필요 <span class="gcount">${gapCount}건</span></h2><p>자동화 가능한 미실행 행입니다. <code>/tk-browser-verify</code>를 인자 없이 실행한 뒤 이 시트를 다시 생성하세요.</p>${gaps}</section>`;
    }

    for (const g of data.groups) {
      const items = g.items.map((it) => renderItem(g, it, "manual")).filter(Boolean);
      if (!items.length) continue;
      html += `<section class="group"><h2>${fmt(g.title)} <span class="gcount"></span></h2><ul class="items">${items.join("")}</ul></section>`;
    }
  } catch (e) { fail(e.message); return; }
  document.getElementById("main").innerHTML = html;

  const stored = read(KEY, {});
  const state = Object.create(null);
  if (object(stored)) for (const [id, timestamp] of Object.entries(stored)) {
    if (seen.has(id) && Number.isFinite(timestamp) && timestamp > 0) state[id] = timestamp;
  }
  const boxes = [...document.querySelectorAll("li.check input")];
  let prunedAuto = false;
  for (const b of boxes) {
    if (b.dataset.auto === "true" && state[b.dataset.id]) {
      delete state[b.dataset.id];
      prunedAuto = true;
    }
  }
  if (prunedAuto) write(KEY, state);
  const render = () => {
    let done = 0;
    for (const b of boxes) {
      b.checked = b.dataset.auto === "true" || !!state[b.dataset.id];
      b.closest("li.check").classList.toggle("checked", b.checked);
      if (b.checked) done++;
    }
    document.getElementById("count").textContent = `${done} / ${boxes.length}`;
    document.getElementById("bar").style.width = boxes.length ? `${(done / boxes.length) * 100}%` : "0";
    for (const g of document.querySelectorAll(".group")) {
      const gb = [...g.querySelectorAll("li.check input")];
      const gd = gb.filter((b) => b.checked).length;
      g.querySelector(".gcount").textContent = `${gd} / ${gb.length}`;
      g.classList.toggle("complete", gb.length > 0 && gd === gb.length);
    }
  };
  for (const b of boxes) {
    if (b.dataset.auto === "true") continue;
    b.addEventListener("change", () => {
      if (b.checked) state[b.dataset.id] = Date.now(); else delete state[b.dataset.id];
      write(KEY, state); render();
    });
  }
  document.getElementById("reset").addEventListener("click", () => {
    if (!confirm("체크 상태를 모두 지울까요? 메모는 그대로 둡니다.")) return;
    for (const k of Object.keys(state)) delete state[k];
    write(KEY, state); render();
  });

  const only = document.getElementById("onlyOpen");
  only.checked = read(ONLY, false) === true;
  document.body.classList.toggle("only-open", only.checked);
  only.addEventListener("change", () => { document.body.classList.toggle("only-open", only.checked); write(ONLY, only.checked); });

  const notes = document.getElementById("notes"), saved = document.getElementById("saved");
  const storedNotes = read(NOTES, "");
  notes.value = typeof storedNotes === "string" ? storedNotes : "";
  let t, pending = false;
  const saveNotes = () => {
    clearTimeout(t);
    pending = false;
    saved.textContent = write(NOTES, notes.value)
      ? `저장됨 ${new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" })}`
      : "저장 실패 (localStorage 사용 불가)";
  };
  notes.addEventListener("input", () => {
    clearTimeout(t);
    pending = true;
    t = setTimeout(saveNotes, 400);
  });
  window.addEventListener("pagehide", () => { if (pending) saveNotes(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden && pending) saveNotes(); });

  render();
})();
</script>

<script>
/* tigerkit:html-theme.js */
(() => {
  const start = () => {
    const download = document.querySelector('[data-ht-download]');
    if (!download) return;
    const share = document.querySelector('[data-ht-share]');
    const status = document.querySelector('[data-ht-export-status]');
    const payload = document.querySelector('template[data-ht-export]');
    const encoder = new TextEncoder();
    const decode = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
    const message = text => { if (status) { status.textContent = text; status.hidden = !text; } };
    let blob, filename;
    try {
      if (!payload) throw Error('missing export');
      const encoded = payload.content.textContent.trim();
      const manifest = JSON.parse(new TextDecoder().decode(decode(encoded)));
      filename = manifest.name;
      const entries = manifest.files.map(file => {
        let bytes = decode(file.base64);
        if (file.html) {
          const marker = document.createElement('template');
          marker.setAttribute('data-ht-export', '');
          marker.setAttribute('data-entry', file.path);
          marker.innerHTML = encoded;
          const text = new TextDecoder().decode(bytes).replace(/<\/body\s*>/i, match => marker.outerHTML + match);
          bytes = encoder.encode(text);
        }
        return {name: encoder.encode(file.path), bytes};
      });
      if (entries.length === 1) {
        blob = new Blob([entries[0].bytes], {type: 'text/html;charset=utf-8'});
      } else {
        // ZIP STORE: no compression dependency or runtime network, UTF-8 paths.
        const parts = [], directory = [];
        let offset = 0, directorySize = 0;
        const header = size => new DataView(new ArrayBuffer(size));
        for (const {name, bytes} of entries) {
          let crc = 0xffffffff;
          for (const byte of bytes) {
            crc ^= byte;
            for (let bit = 0; bit < 8; bit++) crc = (crc >>> 1) ^ ((crc & 1) ? 0xedb88320 : 0);
          }
          crc = (crc ^ 0xffffffff) >>> 0;
          const local = header(30), central = header(46);
          local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true);
          local.setUint16(6, 0x800, true); local.setUint16(12, 33, true);
          local.setUint32(14, crc, true); local.setUint32(18, bytes.length, true);
          local.setUint32(22, bytes.length, true); local.setUint16(26, name.length, true);
          central.setUint32(0, 0x02014b50, true); central.setUint16(4, 20, true);
          central.setUint16(6, 20, true); central.setUint16(8, 0x800, true);
          central.setUint16(14, 33, true); central.setUint32(16, crc, true);
          central.setUint32(20, bytes.length, true); central.setUint32(24, bytes.length, true);
          central.setUint16(28, name.length, true); central.setUint32(42, offset, true);
          parts.push(local.buffer, name, bytes); directory.push(central.buffer, name);
          offset += 30 + name.length + bytes.length; directorySize += 46 + name.length;
        }
        const end = header(22);
        end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true);
        end.setUint16(10, entries.length, true); end.setUint32(12, directorySize, true);
        end.setUint32(16, offset, true);
        blob = new Blob([...parts, ...directory, end.buffer], {type: 'application/zip'});
      }
    } catch {
      message('다운로드 자료를 준비하지 못했습니다. 생성한 원본 파일을 확인해 주세요.');
      return;
    }
    download.title = download.getAttribute('aria-label') === '다운로드' ? filename : download.title;
    download.hidden = false;
    download.addEventListener('click', () => {
      let url;
      try {
        url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url; link.download = filename;
        document.body.append(link); link.click(); link.remove();
        message('');
      } catch { message('다운로드하지 못했습니다. 브라우저의 다운로드 설정을 확인해 주세요.'); }
      finally { if (url) setTimeout(() => URL.revokeObjectURL(url), 30000); }
    });
    const nav = globalThis.navigator;
    if (share && globalThis.isSecureContext && nav?.share && nav?.canShare && typeof File !== 'undefined') {
      const file = new File([blob], filename, {type: blob.type});
      let supported = false;
      try { supported = nav.canShare({files: [file]}); } catch {}
      if (supported) {
        share.hidden = false;
        share.addEventListener('click', async () => {
          try { await nav.share({files: [file], title: document.title}); message(''); }
          catch (error) { if (error.name !== 'AbortError') message('공유하지 못했습니다. 다운로드 버튼으로 파일을 저장해 주세요.'); }
        });
      }
    }
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, {once: true});
  else start();
})();

(() => {
  const control = document.querySelector('[data-ht-theme-control]');
  if (!control) return;
  const inputs = [...control.querySelectorAll('input[name="ht-theme"]')];
  if (!inputs.length) return;
  const root = document.documentElement;
  const key = 'tigerkit-html-theme';
  const valid = value => ['system', 'light', 'dark'].includes(value);
  const configuredValue = root.getAttribute('data-default-theme');
  const configured = valid(configuredValue) ? configuredValue : 'system';
  const apply = value => {
    if (value === 'system') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', value);
    for (const input of inputs) input.checked = input.value === value;
  };
  let saved = configured;
  try { const value = localStorage.getItem(key); if (valid(value)) saved = value; } catch {}
  apply(saved);
  for (const input of inputs) {
    input.addEventListener('change', () => {
      if (!input.checked) return;
      const value = valid(input.value) ? input.value : 'system';
      apply(value);
      try { localStorage.setItem(key, value); } catch {}
    });
  }
  control.hidden = false;
})();

(() => {
  const theme = document.querySelector('[data-ht-theme-control]');
  if (!theme) return;
  const root = document.documentElement;
  const key = 'tigerkit-html-font-size';
  const sizes = ['50', '75', '100', '125', '150', '175', '200'];
  const group = document.createElement('div');
  group.className = 'ht-reader-controls';
  const label = document.createElement('label');
  label.className = 'ht-font-control';
  const caption = document.createElement('span');
  caption.className = 'ht-visually-hidden';
  caption.textContent = '글자 크기';
  const select = document.createElement('select');
  select.setAttribute('data-ht-font-size', '');
  select.setAttribute('aria-label', '글자 크기');
  select.title = '글자 크기';
  for (const size of sizes) {
    const option = document.createElement('option');
    option.value = size;
    option.textContent = `${size}%`;
    select.append(option);
  }
  const apply = value => {
    select.value = sizes.includes(value) ? value : '100';
    root.style.setProperty('--ht-font-scale', String(Number(select.value) / 100));
  };
  let saved = '100';
  try { const value = localStorage.getItem(key); if (sizes.includes(value)) saved = value; } catch {}
  apply(saved);
  select.addEventListener('change', () => {
    apply(select.value);
    try { localStorage.setItem(key, select.value); } catch {}
  });
  label.append(caption, select);
  theme.before(group);
  group.append(label, theme);
})();

(() => {
  const nav = document.querySelector('.ht-doc-nav');
  if (!nav) return;
  const toc = nav.querySelector('.ht-doc-toc');
  const summary = toc?.querySelector('summary');
  const narrowNavigation = globalThis.matchMedia?.('(max-width: 960px)');
  const syncNavigationMode = () => { if (toc && narrowNavigation) toc.open = !narrowNavigation.matches; };
  syncNavigationMode();
  narrowNavigation?.addEventListener('change', syncNavigationMode);
  const links = [...nav.querySelectorAll('.ht-doc-toc-panel a[href^="#"]')];
  const targetFor = hash => {
    try { return document.getElementById(decodeURIComponent(hash.slice(1))); } catch { return null; }
  };
  const sections = links.map(link => targetFor(link.hash)).filter(Boolean);
  const close = (returnFocus = false) => {
    if (!toc?.open || !narrowNavigation?.matches) return;
    toc.open = false;
    if (returnFocus) summary?.focus({preventScroll: true});
  };
  nav.addEventListener('keydown', event => {
    if (event.key === 'Escape' && toc?.open) { event.preventDefault(); close(true); }
  });
  document.addEventListener('click', event => { if (!nav.contains(event.target)) close(); });
  nav.addEventListener('focusout', () => {
    requestAnimationFrame(() => { if (!nav.contains(document.activeElement)) close(); });
  });
  // Native anchor navigation owns hashes, history and scrolling; only enhance focus.
  document.addEventListener('click', event => {
    const link = event.target.closest?.('a[href^="#"]');
    if (!link || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    const target = targetFor(link.hash);
    if (!target) return;
    close();
    const added = !target.hasAttribute('tabindex');
    if (added) target.setAttribute('tabindex', '-1');
    target.focus({preventScroll: true});
    if (added) target.addEventListener('blur', () => target.removeAttribute('tabindex'), {once: true});
  });
  const bar = document.querySelector('.ht-topbar');
  const offset = () => {
    const height = bar && getComputedStyle(bar).position === 'sticky' ? bar.getBoundingClientRect().height : 0;
    document.documentElement.style.setProperty('--ht-anchor-offset', `${height + 16}px`);
  };
  offset();
  if (bar && typeof ResizeObserver !== 'undefined') new ResizeObserver(offset).observe(bar);
  const mark = id => {
    for (const link of links) {
      if (targetFor(link.hash)?.id === id) link.setAttribute('aria-current', 'location');
      else link.removeAttribute('aria-current');
    }
  };
  const current = () => {
    const top = bar && getComputedStyle(bar).position === 'sticky' ? Math.max(0, bar.getBoundingClientRect().bottom) : 0;
    // Select the deepest section at the reading edge, not its enclosing area.
    const edge = top + 48;
    let active = null, upcoming = null, nearest = Infinity;
    for (const section of sections) {
      const r = section.getBoundingClientRect();
      if (r.top <= edge && r.bottom > edge) {
        if (!active || active.contains(section)) active = section;
      } else if (r.top > edge && r.top < innerHeight && r.top < nearest) {
        upcoming = section; nearest = r.top;
      }
    }
    active ||= upcoming;
    if (active) mark(active.id);
  };
  const hash = () => { const target = targetFor(location.hash); if (target && sections.includes(target)) mark(target.id); else current(); };
  let pending = false;
  const schedule = () => { if (!pending) { pending = true; requestAnimationFrame(() => { current(); pending = false; }); } };
  addEventListener('hashchange', hash);
  addEventListener('scroll', schedule, {passive: true});
  addEventListener('resize', () => { offset(); schedule(); });
  hash();
})();

(() => {
  const citations = [...(document.querySelectorAll?.('.ht-document sup[id^="cite-"] > a[href^="#ref-"]') || [])];
  if (!citations.length) return;
  const preview = document.createElement('div');
  preview.id = 'ht-citation-preview';
  preview.className = 'ht-citation-preview';
  preview.setAttribute('role', 'tooltip');
  preview.hidden = true;
  document.body.append(preview);
  let active = null;
  const hide = () => {
    if (active) {
      const described = (active.getAttribute('aria-describedby') || '').split(/\s+/).filter(id => id && id !== preview.id);
      if (described.length) active.setAttribute('aria-describedby', described.join(' '));
      else active.removeAttribute('aria-describedby');
    }
    active = null;
    preview.hidden = true;
  };
  const position = () => {
    if (!active || preview.hidden) return;
    const anchor = active.getBoundingClientRect();
    if (anchor.bottom < 0 || anchor.top > innerHeight) { hide(); return; }
    const box = preview.getBoundingClientRect();
    const margin = 12;
    preview.style.left = Math.max(margin, Math.min(anchor.left, innerWidth - box.width - margin)) + 'px';
    const above = anchor.top - box.height - 8;
    const below = Math.min(anchor.bottom + 8, innerHeight - box.height - margin);
    preview.style.top = Math.max(margin, above >= margin ? above : below) + 'px';
  };
  const show = link => {
    let reference;
    try { reference = document.getElementById(decodeURIComponent(link.hash.slice(1))); } catch { return; }
    if (!reference?.matches('li[id]')) return;
    const content = reference.cloneNode(true);
    for (const back of content.querySelectorAll('a[href^="#cite-"]')) back.remove();
    const text = content.textContent.replace(/\s+/g, ' ').trim();
    if (!text) return;
    hide();
    active = link;
    preview.textContent = text;
    preview.hidden = false;
    const described = link.getAttribute('aria-describedby');
    link.setAttribute('aria-describedby', [described, preview.id].filter(Boolean).join(' '));
    position();
  };
  for (const link of citations) {
    link.addEventListener('pointerenter', event => { if (event.pointerType !== 'touch') show(link); });
    link.addEventListener('pointerleave', () => { if (document.activeElement !== link) hide(); });
    link.addEventListener('focus', () => show(link));
    link.addEventListener('blur', hide);
    link.addEventListener('click', hide);
  }
  document.addEventListener('keydown', event => { if (event.key === 'Escape') hide(); });
  addEventListener('hashchange', hide);
  addEventListener('scroll', position, {passive: true});
  addEventListener('resize', position);
})();

(() => {
  const start = () => {
    (document.querySelectorAll?.('pre.ht-code') || []).forEach((block, index) => {
      if (block.previousElementSibling?.classList.contains('ht-code-toolbar')) return;
      const toolbar = document.createElement('div');
      toolbar.className = 'ht-code-toolbar';
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = '줄바꿈';
      button.setAttribute('aria-label', `코드 블록 ${index + 1} 줄바꿈`);
      button.setAttribute('aria-pressed', 'false');
      button.addEventListener('click', () => {
        const wrap = block.toggleAttribute('data-wrap');
        button.setAttribute('aria-pressed', String(wrap));
      });
      toolbar.append(button);
      block.before(toolbar);
    });
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, {once: true});
  else start();
})();
