<p class="ht-lede">카드의 점 개수로 분류 위치를 정합니다.</p>
<section id="card-rule" data-ht-nav-unit class="ht-lesson-step"><h2>어떤 기준으로 분류할까요?</h2>
<div class="ht-lesson-workbench"><div class="ht-lesson-instruction"><p>점이 1개인 카드는 A, 2개인 카드는 B에 놓습니다. 점이 없는 카드는 어느 쪽에도 넣지 않습니다. 색과 모양은 기준이 아닙니다.</p><p><a href="#worked-card" data-ht-focus="worked-card">분류 예시를 확인합니다.</a></p></div><figure id="worked-card" class="ht-lesson-example"><figcaption>예시 카드</figcaption><p>점 1개인 삼각형 카드는 A에 놓습니다.</p></figure></div>
<div id="card-practice" class="ht-lesson-practice" data-ht-practice><h3>세 카드를 분류해 보세요</h3><p>점 2개인 원, 점이 없는 사각형, 점 1개인 별을 각각 어디에 놓을까요?</p>
<details data-ht-hint><summary>힌트 보기</summary><p>모양 대신 점의 개수를 확인해 보세요.</p></details>
<details data-ht-solution><summary>해설 보기</summary><p>점이 2개인 원은 B, 점이 없는 사각형은 어느 쪽에도 넣지 않으며, 점이 1개인 별은 A입니다.</p></details>
<a href="#card-practice" data-ht-retry>다시 생각해 보기</a></div></section>
