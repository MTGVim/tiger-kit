<p class="ht-lede">캐시가 만료 시각에 도달했을 때 값을 반환할지 판단해 봅니다.</p>
<section id="expiry-rule" data-ht-nav-unit class="ht-lesson-step">
<h2>만료 시각과 같으면 어떻게 될까요?</h2>
<div class="ht-lesson-workbench"><div class="ht-lesson-instruction"><p>이 예시는 age가 ttl 이상이면 만료되는 캐시를 가정합니다.</p><p><a href="#expiry-code" data-ht-focus="expiry-code">판정 조건을 확인합니다.</a></p></div>
<figure id="expiry-code" class="ht-lesson-example"><figcaption>만료 여부를 판단하는 예시 함수</figcaption><pre class="ht-code" data-numbered><code><span class="ht-code-line" data-line="1"><span class="ht-code-keyword">const</span> isExpired <span class="ht-code-punctuation">=</span> <span class="ht-code-punctuation">(</span>age<span class="ht-code-punctuation">,</span> ttl<span class="ht-code-punctuation">)</span> <span class="ht-code-punctuation">=</span><span class="ht-code-punctuation">&gt;</span> age <span class="ht-code-punctuation">&gt;</span><span class="ht-code-punctuation">=</span> ttl<span class="ht-code-punctuation">;</span>
</span></code></pre></figure></div>
<div id="expiry-practice" class="ht-lesson-practice" data-ht-practice><h3>먼저 예측해 보세요</h3><p>ttl이 60일 때 age가 59, 60, 61이면 각각 유효할까요?</p>
<details data-ht-hint><summary>힌트 보기</summary><p>각 값을 비교 연산자의 왼쪽에 대입해 보세요.</p></details>
<details data-ht-solution><summary>해설과 관찰 결과 보기</summary><p>59는 유효하고 60과 61은 만료됩니다. 이 예시는 같은 시각도 만료에 포함합니다. 이 결과는 식에서 추론했으며 실제 실행 결과는 아닙니다.</p></details>
<a href="#expiry-practice" data-ht-retry>다시 생각해 보기</a></div></section>
