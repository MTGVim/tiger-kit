interface:
  short_description: "[user] 저장소 질문을 근거와 함께 자연스럽게 설명하고 공유용 요약을 제공합니다."
  default_prompt: "`tk-ask-repo`로 저장소 질문을 읽기 전용으로 끝까지 추적하세요. 질문에 먼저 직접 답하고 중요한 주장 옆에 `path:line` 근거를 붙이세요. 공유 요청이나 복합 조사의 영향·소유권 결론을 별도로 전달할 때만 검증된 사실과 한계를 간결하게 요약하며, 자체 완결적인 짧은 답변에는 중복 요약을 붙이지 마세요."

policy:
  allow_implicit_invocation: false
