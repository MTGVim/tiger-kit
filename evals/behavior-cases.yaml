  expect: "Evidence checks the current host's discoverable file-based persistent memory as a fifth target axis and routes a complete duplicate to no-op."
- case: reflect-separates-adjacent-memory-scope
  skill: tk-reflect
  expect: "When persistent memory and a candidate share facts but own different behavioral axes, Interpretation records the separation and any reciprocal cross-reference remains pending."
- case: reflect-bounds-summary-cell-length
  skill: tk-reflect
  expect: "A formatting-only Disposition reprint preserves IDs and order while omitting evidence bodies, drafts, and work narration."
- case: reflect-drive-applies-eligible-tracked-repo-rule
