- case: to-spec-echoes-drive-transition
  skill: tk-to-spec
  expect: "A Ready active-drive spec receipt echoes `Return to: tk-drive` and the parent-supplied `Outstanding transition` verbatim without making the ticket decision."
- case: to-spec-returns-decision-blocker-to-drive
