  expect: "Multi-slice or long-resume work tracks pending, in_progress, verified, or blocked with evidence and revalidates on resume."
- case: drive-bounds-nested-skills
  skill: tk-drive
  expect: "Prepared drive invokes only tk-implement and one post-Pass drive-optimistic tk-reflect tail, with browser verification or merge-conflict support when required."
- case: drive-commits-per-ticket
  skill: tk-drive
  expect: "Each independently verifiable ticket is handed to tk-implement for one commit, and drive creates no separate final commit."
- case: drive-preserves-valid-diff-on-partial-failure
  skill: tk-drive
  expect: "A later ticket failure preserves earlier verified ticket commits without rollback or history rewriting."
- case: drive-aggregate-review-boundary
  skill: tk-drive
  expect: "tk-implement owns ticket-level Standards/Spec review while drive owns aggregate R/AC coverage, ancestry, and cross-ticket interaction without repeating line-level review."
- case: drive-invokes-phase-owners
  skill: tk-drive
  expect: "Drive follows the exact applicable procedure graph, invokes each owner directly, and never asks a successful child to return control to its caller."
- case: drive-continues-after-preflight
  skill: tk-drive
  expect: "Completed preflight is never a response boundary: drive continues through implementation, aggregate verification, reflection, and finalization."
- case: drive-enforces-exact-procedure-graph
  skill: tk-drive
  expect: "Every edge uses a canonical node name and declares entry, success, failure, and next-node conditions; unknown nodes, misspellings, forbidden cycles, and incomplete edges fail validation."
- case: drive-continues-without-receipt-boundary
  skill: tk-drive
  expect: "Successful active-drive procedures invoke the next applicable node in the same turn without a user turn, success receipt, caller-return instruction, or terminal output between them."
- case: drive-continues-multi-unit-through-reflection
  skill: tk-drive
  expect: "A multi-unit run continues after the first tk-implement unit, finishes every selected unit, performs aggregate verification, runs the valid reflection tail, and reaches finalization."
- case: drive-owns-single-terminal-response
  skill: tk-drive
  expect: "Only tk-drive finalization emits exactly one active-drive terminal response, beginning with the result and containing no standalone separator, Outcome label, receipt heading, phase Pass token, caller-return instruction, or bottom provenance block."
- case: drive-prepares-trivial-task
  skill: tk-drive
  expect: "Every explicit source, including a trivial single slice, passes through internal Ready preparation and then continues automatically into implementation."
- case: drive-skips-grill-for-ready-source
  skill: tk-drive
  expect: "Drive skips tk-grill-me when confirmed source and evidence already support a Ready spec without a user-owned decision."
- case: drive-preflights-material-strategy
  skill: tk-drive
  expect: "Preparing inspects implementation and verification strategy before product mutation, resolves repository-evidenced and implementation-owned facts itself, and asks one at a time only about material user-owned choices."
- case: drive-classifies-browser-strategy-conditionally
  skill: tk-drive
  expect: "Browser evidence is classified required, optional, or N/A; only a required or selected optional route binds target environment, mode, role/tenant, opaque profile hint, auth expectation, and safe interactions."
- case: drive-browser-na-is-silent
  skill: tk-drive
  expect: "A task with no browser-relevant behavior records browser evidence as N/A without asking an account/profile question or creating an empty browser strategy section."
- case: drive-rehydrates-omitted-browser-identity
  skill: tk-drive
  expect: "Preparation persists only non-identifying browser hints plus an intentionally-omitted cold-start marker; a fresh executor re-requests the exact runtime identity once before launch without consuming a Preparing amendment."
- case: drive-amends-on-first-new-decision
  skill: tk-drive
  expect: "The first late user-owned decision enters one bounded Preparing amendment, revalidates the spec and affected tickets, refreshes current artifacts, and resumes Executing."
- case: drive-blocks-second-amendment
  skill: tk-drive
  expect: "After one Preparing amendment has been consumed, a repeated blocker or second user-owned decision stops Blocked without another artifact mutation."
- case: drive-blocks-repeated-decision-return
  skill: tk-drive
  expect: "The same or equivalent decision blocker after confirmation stops Blocked instead of entering another automatic grill loop."
- case: drive-runs-final-aggregate-verification
  skill: tk-drive
  expect: "After all unit commits, drive reconciles ordered ancestry and all R/AC, checks cross-ticket effects, and runs the broadest executable relevant verification once."
- case: drive-propagates-phase-failure
  skill: tk-drive
  expect: "Unavailable or unsuccessful phase owners stop the workflow at that phase with the evidence-supported terminal state and no inline fallback."
- case: drive-bounds-corrective-cycle
  skill: tk-drive
  expect: "Initial implementation is excluded from the count; each of at most three corrective cycles targets one observed isolated failure, and a fourth, repeated unchanged failure, or scope expansion stops with the remaining failing command and evidence once."
- case: drive-stops-on-procedure-failure
  skill: tk-drive
  expect: "A blocked or unverifiable procedure exposes one actionable blocking fact once, takes only an evidence-supported alternate edge, and otherwise stops without success evidence or an unchanged-transition loop."
- case: drive-preserves-source-ui-writing-verbatim
  skill: tk-drive
  expect: "Drive consumes the sealed source UI inventory and rechecks exact literals through prepared units, implementation, candidate/staged diff, and rendered UI."
- case: drive-invalidates-source-current-ui-mismatch
  skill: tk-drive
  expect: "An unprepared source-current literal mismatch invalidates prepared authority before Pass or commit; drive does not route a new decision."
- case: drive-invalidates-unapproved-secondary-axis
  skill: tk-drive
  expect: "A decision approval covers only the axis explicitly asked; ancillary premises in an option explanation stay unconfirmed and cannot authorize UI writing changes."
- case: drive-reads-complete-remote-source
  skill: tk-drive
  expect: "Preparation owns complete remote-source retrieval; drive verifies the sealed source digest and refuses raw or amended source."
- case: drive-blocks-unreadable-ui-literal
  skill: tk-drive
  expect: "Unreadable source UI literals are never guessed and prevent commit as Unverifiable."
- case: drive-invalidates-conflicting-ui-literals
  skill: tk-drive
  expect: "A newly conflicting UI literal invalidates the sealed run without invoking a decision phase or changing product Git."
- case: drive-commit-command-failure-is-fail
  skill: tk-drive
  expect: "A failed final commit command preserves its output and actual Git state and terminates as Fail without claiming commit success."
- case: drive-precommit-drift-is-blocked
  skill: tk-drive
  expect: "HEAD or staged-snapshot drift after verification blocks commit and requires a new fixed-point verification."
- case: drive-carries-authorized-ui-writing-change
  skill: tk-drive
  expect: "Drive consumes only the explicitly prepared UI writing change while every other sealed literal remains frozen."
- case: reflect-placement-regression-matrix
  skill: tk-reflect
  expect: "Closed safety tokens, sibling thresholds, no-path, multiple-parent, overrides, and missing-host evidence route deterministically."
- case: grooming-placement-regression-matrix
  skill: tk-grooming
  expect: "Grooming applies the same deterministic placement matrix and maps the result to report-only move or convert proposals."
- case: reflect-skill-candidate-stays-pending
  skill: tk-reflect
  expect: "Reflect reports a skill candidate's evidence, current-host target, working draft, and pending status without semantic mutation."
- case: grooming-semantic-convert-is-proposal-only
  skill: tk-grooming
  expect: "Rule-to-skill conversion, workflow split, and semantic skill rewrites remain proposals even in apply mode."
- case: skill-diagnose-reproduces-overtrigger-selection
  skill: tk-skill-diagnose
  expect: "A repeated over-trigger incident is reproduced in fresh runs, separated from a nearby positive control, and classified as selection."
- case: skill-diagnose-isolates-approval-bypass
  skill: tk-skill-diagnose
  expect: "Normal selection/loading is separated from an approval bypass in planning or execution without canonical mutation."
- case: skill-diagnose-separates-grader-false-negative
  skill: tk-skill-diagnose
  expect: "A correct deliverable misclassified by a grader routes to the evaluation owner instead of inflating the skill body."
- case: skill-diagnose-classifies-host-loading-difference
  skill: tk-skill-diagnose
  expect: "Matched selected/loaded evidence across supported hosts isolates a compatibility or loading difference."
- case: skill-diagnose-verifies-efficiency-regression
  skill: tk-skill-diagnose
  expect: "Matched prompt, host, configuration, tools, repository state, and two trials support an efficiency regression claim."
- case: skill-diagnose-requires-resource-anchor
  skill: tk-skill-diagnose
  expect: "A resource profile without a stable, no-skill, historical, threshold, or candidate anchor remains Profile only and Unverifiable."
- case: skill-diagnose-rejects-cheaper-incorrect-candidate
  skill: tk-skill-diagnose
  expect: "Correctness, safety, routing, mutation, control, or holdout regression rejects a candidate regardless of resource savings."
- case: skill-diagnose-does-not-patch-unreproduced-incident
  skill: tk-skill-diagnose
  expect: "A 0/2 clean reproduction is Not reproduced and does not produce a canonical wording patch from intuition."
- case: skill-diagnose-bounds-one-theme-and-holdout
  skill: tk-skill-diagnose
  expect: "A temporary one-theme candidate names its frozen requirement and General Fix Rule, then preserves nearby control and unused holdout."
- case: skill-diagnose-never-mutates-canonical-path
  skill: tk-skill-diagnose
  expect: "Diagnosis experiments stay isolated and semantic canonical changes become tk-learn handoff proposals without commit."
- case: skill-diagnose-drafts-anonymized-upstream-issue
  skill: tk-skill-diagnose
  expect: "Exact provenance, two fresh upstream reproductions, clean control and holdout, accessible duplicate search, ancestry reconciliation, and redaction permit an anonymized draft without remote mutation."
- case: skill-diagnose-keeps-consumer-drift-local
  skill: tk-skill-diagnose
  expect: "An incident reproduced only in a consumer-local override is local-only and produces no upstream issue draft."
- case: skill-diagnose-withholds-draft-without-exact-ref
  skill: tk-skill-diagnose
  expect: "Missing exact upstream ref or content hash is upstream-unverifiable and suppresses all title/body proposal content."
- case: skill-diagnose-withholds-draft-without-two-upstream-runs
  skill: tk-skill-diagnose
  expect: "Fewer than two fresh matched upstream reproductions cannot reach upstream-draft-ready or emit proposal content."
- case: skill-diagnose-withholds-draft-without-control-holdout
  skill: tk-skill-diagnose
  expect: "Missing nearby control or unused holdout evidence keeps upstream proposal eligibility unverifiable."
- case: skill-diagnose-withholds-draft-for-matching-open-issue
  skill: tk-skill-diagnose
  expect: "A matching open upstream issue is cited and reconciled instead of receiving a duplicate title/body proposal."
- case: skill-diagnose-withholds-draft-for-unverified-closed-regression
  skill: tk-skill-diagnose
  expect: "A matching closed issue is not called a regression without exact later upstream reproduction and fix ancestry evidence."
- case: skill-diagnose-withholds-draft-when-issue-search-unavailable
  skill: tk-skill-diagnose
  expect: "An inaccessible open and closed upstream issue search is not treated as no match and suppresses proposal content."
- case: skill-diagnose-redacts-private-upstream-evidence
  skill: tk-skill-diagnose
  expect: "Private identifiers, paths, URLs, literals, and secrets are removed and residue-checked before any upstream-draft-ready disposition."
- case: reflect-hands-off-qualified-skill-incident-once
  skill: tk-reflect
  expect: "Reflect hands off exactly once only when Target, Incident, Unresolved cause, and Dependency gates all hold."
- case: reflect-skips-diagnosis-without-four-gate
  skill: tk-reflect
  expect: "Historical mentions, an existing valid receipt, no-op, discard, or generic reflection do not invoke Agent Skill diagnosis."
- case: reflect-blocks-repeated-diagnosis-handoff
  skill: tk-reflect
  expect: "An equivalent Incident ID, target, and blocker recurrence ends Blocked without another handoff or reflect-diagnose cycle."
- case: ask-repo-value-finds-assignment-origin
  skill: tk-ask-repo
  expect: "A value question descends past declarations to the assignment site, inspects sibling fields, sweeps consumers, and reports Must not change."
- case: ask-repo-impact-sweeps-consumers
  skill: tk-ask-repo
  expect: "An impact question verifies matching semantics, sweeps all readers and writers, states exclusions, and classifies must change, must not change, and unclear consumers."
- case: ask-repo-existence-distinguishes-states
  skill: tk-ask-repo
  expect: "An existence question checks the current base ref and in-flight work before distinguishing absent, unreleased, empty, and live."
- case: ask-repo-attribution-uses-transport
  skill: tk-ask-repo
  expect: "Attribution follows the consuming path to its end and uses whether the correct value is already present in transport to assign ownership."
- case: ask-repo-blocks-two-candidate-ambiguity
  skill: tk-ask-repo
  expect: "Two defensible candidate answers are presented with evidence and stop Blocked instead of being resolved by the investigator."
- case: ask-repo-refuses-implementation-diff
  skill: tk-ask-repo
  expect: "An implementation or diff request is routed to the appropriate owner without source mutation or a partial investigation."
- case: ask-repo-refuses-effort-estimate
  skill: tk-ask-repo
  expect: "An effort or schedule request reports evidence-supported scale only and refuses a time estimate."
- case: ask-repo-search-failure-is-unverifiable
  skill: tk-ask-repo
  expect: "A failed anchor search lists the searches run and returns Unverifiable instead of reporting absence."
- case: ask-repo-blocks-contradicted-premise
  skill: tk-ask-repo
  expect: "A premise contradicted by repository evidence is reported as a contradiction and stops Blocked."
- case: ask-repo-bounds-result-cardinality
  skill: tk-ask-repo
  expect: "One answer may use one to three short paragraphs, compound answers use bounded bullets or a table, and eight or more results show the top five to seven plus owning evidence paths."
- case: drive-writes-compact-preflight
  skill: tk-drive
  expect: "Preparation atomically writes and strictly rereads one compact secret-free preflight containing only task, repository, graph, verification, browser, and source-reference fields."
- case: drive-preserves-preflight-on-write-failure
  skill: tk-drive
  expect: "A symlink, external path, or interrupted replacement fails without a partial file and preserves any prior preflight byte-for-byte."
- case: drive-rejects-preflight-secrets
  skill: tk-drive
  expect: "Preflight validation rejects lifecycle fields, credentials, cookies, tokens, OTPs, passwords, exact sensitive identity, unsafe URLs, and non-opaque profile hints."
- case: drive-resumes-from-current-evidence
  skill: tk-drive
  expect: "Resume chooses decision closure, spec, tickets, implementation, aggregate verification, reflection, or finalization from current artifacts and repository evidence without a stored status or cursor."
- case: drive-bounds-task-anchored-prior-art
  skill: tk-drive
  expect: "Preparation keeps at most seven task-anchored durable items from allowed repository sources and carries evidence, preferred prevention owner, and host dependency into spec."
- case: drive-excludes-forbidden-prior-art
  skill: tk-drive
  expect: "Raw conversations, old implementation/reflection scratch, pending drafts, global state, and inaccessible host-only rules cannot supply prior-art evidence."
- case: adhd-explicit-one-shot
  skill: tk-adhd
  expect: "Only an explicit current-response tk-adhd invocation applies the ADHD-oriented output shape; tk-reflect is not selected, and current progress plus the next action remain visible."
- case: adhd-does-not-carry-over
  skill: tk-adhd
  expect: "A prior tk-adhd invocation never carries into a later response; no activation, stop, confirmation, preference, or session state exists, and every shaped response requires a new explicit invocation."
- case: adhd-safety-exception
  skill: tk-adhd
  expect: "Destructive action, real ambiguity, a debug spiral, user-requested explanation, or a harness conflict overrides the formatting default without weakening safety."
- case: browser-bounds-result-cardinality
  skill: tk-browser-verify
  expect: "Compound visual, network, and final-state results use bounded bullets or scenario rows; eight or more show the top five to seven plus the browser ledger path."
- case: drive-bounds-result-cardinality
  skill: tk-drive
  expect: "Final output starts directly with its canonical result heading or sentence, explains Implemented and Verification results within their budgets, and appends no separator, receipt, or bottom metadata block."
- case: grill-bounds-confirmed-results
  skill: tk-grill-me
  expect: "Confirmed compound decisions may use two to seven readable rows or bullets while every question turn remains one user-owned decision."
- case: grooming-bounds-result-cardinality
  skill: tk-grooming
  expect: "The existing Disposition table reports bounded readable findings without adding lifecycle behavior or letting the receipt replace result rows."
- case: handoff-bounds-result-cardinality
  skill: tk-handoff
  expect: "Current state, completed work, next action, and blockers use two to five bullets with the artifact path owning any larger inventory."
- case: implement-reports-bounded-behavior-summary
  skill: tk-implement
  expect: "Changed explains two to five behavior-level results and Verification reports one to four core checks before a nonduplicative status/provenance receipt."
- case: learn-bounds-result-cardinality
  skill: tk-learn
  expect: "Promotion decision, candidates, targets, and remaining gates use two to seven rows or bullets and preserve the pre-approval write boundary."
- case: merge-conflict-bounds-result-cardinality
  skill: tk-merge-conflict
  expect: "Resolved intent, path groups, and verification use two to five readable rows or bullets while exact paths remain traceable."
- case: prototype-bounds-result-cardinality
  skill: tk-prototype
  expect: "Comparison results and selection rationale use two to five bullets or option rows, with larger evidence owned by the prototype path."
- case: reflect-bounds-result-cardinality
  skill: tk-reflect
  expect: "The readable ID, Candidate, Action, Target, Why table remains mandatory for non-no-op results and the receipt never reduces it to RF codes."
- case: reflect-classifies-prevention-owner-and-host-dependency
  skill: tk-reflect
  expect: "Every reusable candidate classifies one preferred durable prevention owner and an evidence-backed host dependency without inventing another host's path."
- case: skill-diagnose-bounds-result-cardinality
  skill: tk-skill-diagnose
  expect: "Reproduction, root cause, and candidate results use two to seven bullets or ID rows, with larger evidence owned by the diagnosis ledger."
- case: to-spec-bounds-result-cardinality
  skill: tk-to-spec
  expect: "The Ready or non-Ready decision leads two to five scope, requirement, or exception bullets and cites the owning spec artifact."
- case: to-spec-disposes-prior-art-semantically
  skill: tk-to-spec
  expect: "Relevant prior art receives one adopted, already-satisfied, not-applicable, or conflict disposition with evidence, rationale, and semantic R/AC mapping."
- case: to-spec-omits-empty-prior-art
  skill: tk-to-spec
  expect: "No relevant prior art creates no Prior art section, empty table, none placeholder, or output ceremony."
- case: to-spec-blocks-prior-art-conflict
  skill: tk-to-spec
  expect: "A prior-art conflict blocks Ready and returns exact decision evidence to active drive Preparing."
- case: to-tickets-bounds-result-cardinality
  skill: tk-to-tickets
  expect: "Two to seven tickets use the readable slice table; larger decompositions show the top five to seven plus coverage summary and artifact path."
- case: drive-response-language-explicit-korean
  skill: tk-drive
  expect: "The decision-complete Korean canary task reaches the normal drive summary; the latest explicit Korean instruction keeps every free-form progress and result sentence in Korean while canonical machine tokens remain stable."
- case: drive-response-language-explicit-english
  skill: tk-drive
  expect: "The latest explicit English instruction overrides earlier Korean context for free-form prose while canonical machine tokens remain unchanged."
- case: drive-risk-profile-low-risk-silent
  skill: tk-drive
  expect: "A source-evidenced low-risk change keeps the baseline flow silent and adds no profile artifact, reviewer, browser run, compatibility command, or default output."
- case: drive-risk-profile-browser-ui
  skill: tk-drive
  expect: "Persistent browser/UI and network evidence derives canonical regression-seam and browser-verdict obligations before implementation while browser ownership stays with tk-implement and tk-browser-verify."
- case: drive-risk-profile-auth-data
  skill: tk-drive
  expect: "Authentication and user-data evidence derives regression-seam, side-effect-recovery, and independent-review once in canonical order without adding unsupported browser work."
- case: drive-risk-profile-inaccessible-evidence
  skill: tk-drive
  expect: "Inaccessible required schema and rollback evidence stops Unverifiable before spec weakening, implementation, commit, aggregate Pass, or reflection."
- case: reflect-response-language-preserves-machine-tokens
  skill: tk-reflect
  expect: "Korean explanatory prose preserves canonical headings, receipt keys, status tokens, IDs, commands, paths, code, and exact source literals byte-for-byte."
