- case: to-tickets-preserves-source-ui-writing-verbatim
  skill: tk-to-tickets
  expect: "Provided UI writing remains exact in the source inventory, coverage, and owning tickets unless an explicit source decision authorizes a change."
- case: to-tickets-blocks-source-current-ui-mismatch
  skill: tk-to-tickets
  expect: "Ticket decomposition preserves the three-column UI inventory and stops when the source column is absent or a source-current conflict escaped the Ready spec."
- case: to-tickets-active-drive-handoff
  skill: tk-to-tickets
  expect: "An explicit active-drive ticket handoff uses the standalone vertical-slice contract and returns a drive-consumable ledger receipt without implementing."
- case: to-tickets-echoes-drive-transition
  skill: tk-to-tickets
  expect: "A successful active-drive ticket receipt echoes `Return to: tk-drive` and the parent-supplied `Outstanding transition` verbatim without implementing."
- case: to-tickets-returns-decision-blocker-to-drive
  skill: tk-to-tickets
  expect: "A user-decision blocker returns `User decision: required`, the new decision, and evidence in a native ticket receipt to drive without invoking grill or editing the Ready spec."
- case: prototype-is-not-production
