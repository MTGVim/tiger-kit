<!doctype html>
<html lang="ko" data-default-theme="system">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>입력 자료가 네 가지 결과로 바뀌는 과정</title><style>/* SHARED_THEME_CSS */
main { max-width: 56rem; padding: 24px; margin: auto; }
figure { margin: 0; } figcaption { font-weight: 700; }
</style></head>
<body><main>
<h1>입력 자료가 네 가지 결과로 바뀌는 과정</h1>
<fieldset class="ht-theme-control" data-ht-theme-control hidden>
  <legend class="ht-theme-label">테마</legend><div class="ht-theme-buttons">
    <label class="ht-theme-option"><input name="ht-theme" type="radio" value="system"><span>시스템</span></label>
    <label class="ht-theme-option"><input name="ht-theme" type="radio" value="light"><span>라이트</span></label>
    <label class="ht-theme-option"><input name="ht-theme" type="radio" value="dark"><span>다크</span></label>
  </div>
</fieldset>
<p>하나의 입력을 처리하면 목적이 다른 결과가 동시에 생성됩니다. 모든 결과를 다음 검토에서 재사용합니다.</p>
<figure aria-labelledby="flow-title">
<figcaption id="flow-title">입력 → 처리 → 동시 결과 → 재사용</figcaption>
<ol class="ht-flow">
  <li><div class="ht-card"><h2>입력 자료</h2><p>검증된 요청과 출처를 하나의 묶음으로 모읍니다.</p></div>
    <p class="ht-flow-link"><span aria-hidden="true">↓</span> 입력 자료를 중앙 처리에 전달합니다.</p></li>
  <li><div class="ht-card ht-flow-focus"><h2>중심 처리</h2><p>자료를 검토하고 각 결과가 맡을 역할을 정합니다.</p></div>
    <p class="ht-flow-link"><span aria-hidden="true">↓</span> 목적이 다른 결과를 동시에 생성합니다.</p></li>
  <li><h2>동시 결과</h2><ul class="ht-flow-results">
    <!-- RESULTS -->
  </ul><p class="ht-flow-link"><span aria-hidden="true">↓</span> 생성한 모든 결과를 후속 검토에 사용합니다.</p></li>
  <li class="ht-card"><h2>후속 재사용</h2><p>다음 검토에서 각 결과의 근거와 판단을 다시 확인합니다.</p>
    <a href="#flow-title">흐름의 시작으로 이동</a></li>
</ol></figure>
</main><script>/* SHARED_THEME_JS */</script></body></html>
