<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title description"><title id="title">대기열에서 작업을 처리하는 순서</title><desc id="description">설명을 위한 예시 시간축입니다. 요청이 대기열에 도착한 뒤 작업자가 처리하고 완료를 알립니다.</desc><style>text{font-family:system-ui,sans-serif;fill:#173c2e}.packet{opacity:0;animation-duration:8s;animation-timing-function:linear;animation-iteration-count:infinite}@keyframes event-sent{0%,2.5%{opacity:0;transform:translate(0px,0px)}3%{opacity:1}11.25%{opacity:1;transform:translate(240px,0px)}12.5%,100%{opacity:0;transform:translate(240px,0px)}}@keyframes event-started{0%,23.75%{opacity:0;transform:translate(0px,0px)}24.25%{opacity:1}33.75%{opacity:1;transform:translate(240px,0px)}35%,100%{opacity:0;transform:translate(240px,0px)}}@keyframes event-done{0%,36.875%{opacity:0;transform:translate(0px,0px)}37.375%{opacity:1}38.075%{opacity:1;transform:translate(0px,80px)}50.675%{opacity:1;transform:translate(-840px,80px)}51.875%{opacity:1;transform:translate(-840px,0px)}53.125%,100%{opacity:0;transform:translate(-840px,0px)}}@media(prefers-reduced-motion:reduce){.packet{display:none;animation:none}}</style><rect width="100%" height="100%" fill="#fff"/><polyline points="970,224 970,304 130,304 130,224" fill="none" stroke="#55746a" stroke-width="2"/><polygon points="130,224 125,233 135,233" fill="#55746a"/><polyline points="640,192 880,192" fill="none" stroke="#55746a" stroke-width="2"/><polygon points="880,192 871,187 871,197" fill="#55746a"/><polyline points="220,192 460,192" fill="none" stroke="#55746a" stroke-width="2"/><polygon points="460,192 451,187 451,197" fill="#55746a"/><text x="32" y="40" font-size="24" font-weight="700">대기열에서 작업을 처리하는 순서</text><rect x="40" y="160" width="180" height="64" rx="8" fill="#edf4f1" stroke="#41685a"/><text x="130" y="198" text-anchor="middle" font-size="18">요청자</text><rect x="460" y="160" width="180" height="64" rx="8" fill="#edf4f1" stroke="#41685a"/><text x="550" y="198" text-anchor="middle" font-size="18">대기열</text><rect x="880" y="160" width="180" height="64" rx="8" fill="#edf4f1" stroke="#41685a"/><text x="970" y="198" text-anchor="middle" font-size="18">작업자</text><text x="32" y="540" font-size="18">1. 요청자 → 대기열: 작업 등록 (0.2–0.9s)</text><text x="32" y="572" font-size="18">2. 대기열 → 작업자: 대기 후 처리 (1.9–2.7s)</text><text x="32" y="604" font-size="18">3. 작업자 → 요청자: 완료 알림 (2.95–4.15s)</text><circle class="packet" cx="220" cy="192" r="5" fill="#147c53" style="animation-name:event-sent"/><circle class="packet" cx="640" cy="192" r="5" fill="#147c53" style="animation-name:event-started"/><circle class="packet" cx="970" cy="224" r="5" fill="#147c53" style="animation-name:event-done"/></svg>
