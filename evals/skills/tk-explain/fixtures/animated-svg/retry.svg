<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title description"><title id="title">실패한 요청을 기다린 뒤 재시도하기</title><desc id="description">예시 시간입니다. 첫 전송 이후 대기 시간이 지난 다음 같은 전송을 재시도합니다.</desc><style>text{font-family:system-ui,sans-serif;fill:#173c2e}.packet{opacity:0;animation-duration:8s;animation-timing-function:linear;animation-iteration-count:infinite}@keyframes event-first{0%,2.5%{opacity:0;transform:translate(0px,0px)}3%{opacity:1}10%{opacity:1;transform:translate(240px,0px)}11.25%,100%{opacity:0;transform:translate(240px,0px)}}@keyframes event-retry{0%,35%{opacity:0;transform:translate(0px,0px)}35.5%{opacity:1}42.5%{opacity:1;transform:translate(240px,0px)}43.75%,100%{opacity:0;transform:translate(240px,0px)}}@keyframes event-accepted{0%,45.625%{opacity:0;transform:translate(0px,0px)}46.125%{opacity:1}55.625%{opacity:1;transform:translate(240px,0px)}56.875%,100%{opacity:0;transform:translate(240px,0px)}}@media(prefers-reduced-motion:reduce){.packet{display:none;animation:none}}</style><rect width="100%" height="100%" fill="#fff"/><polyline points="970,224 970,304 130,304 130,224" fill="none" stroke="#55746a" stroke-width="2"/><polygon points="130,224 125,233 135,233" fill="#55746a"/><polyline points="640,192 880,192" fill="none" stroke="#55746a" stroke-width="2"/><polygon points="880,192 871,187 871,197" fill="#55746a"/><polyline points="220,192 460,192" fill="none" stroke="#55746a" stroke-width="2"/><polygon points="460,192 451,187 451,197" fill="#55746a"/><text x="32" y="40" font-size="24" font-weight="700">실패한 요청을 기다린 뒤 재시도하기</text><rect x="40" y="160" width="180" height="64" rx="8" fill="#edf4f1" stroke="#41685a"/><text x="130" y="198" text-anchor="middle" font-size="18">요청자</text><rect x="460" y="160" width="180" height="64" rx="8" fill="#edf4f1" stroke="#41685a"/><text x="550" y="198" text-anchor="middle" font-size="18">대기열</text><rect x="880" y="160" width="180" height="64" rx="8" fill="#edf4f1" stroke="#41685a"/><text x="970" y="198" text-anchor="middle" font-size="18">작업자</text><text x="32" y="540" font-size="18">1. 요청자 → 대기열: 첫 전송 (0.2–0.8s)</text><text x="32" y="572" font-size="18">2. 요청자 → 대기열: 실패 후 재시도 (2.8–3.4s)</text><text x="32" y="604" font-size="18">3. 대기열 → 작업자: 성공한 작업 전달 (3.65–4.45s)</text><circle class="packet" cx="220" cy="192" r="5" fill="#147c53" style="animation-name:event-first"/><circle class="packet" cx="220" cy="192" r="5" fill="#147c53" style="animation-name:event-retry"/><circle class="packet" cx="640" cy="192" r="5" fill="#147c53" style="animation-name:event-accepted"/></svg>
