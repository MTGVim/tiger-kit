<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title description"><title id="title">하나의 사건을 여러 수신자에게 전파하기</title><desc id="description">설명을 위한 예시 시간입니다. 두 수신자에게 같은 시점에 사건을 보냅니다.</desc><style>text{font-family:system-ui,sans-serif;fill:#173c2e}.packet{opacity:0;animation-duration:8s;animation-timing-function:linear;animation-iteration-count:infinite}@keyframes event-a{0%,5%{opacity:0;transform:translate(0px,0px)}5.5%{opacity:1}17.5%{opacity:1;transform:translate(240px,0px)}18.75%,100%{opacity:0;transform:translate(240px,0px)}}@keyframes event-b{0%,5%{opacity:0;transform:translate(0px,0px)}5.5%{opacity:1}6%{opacity:1;transform:translate(0px,80px)}16.5%{opacity:1;transform:translate(840px,80px)}17.5%{opacity:1;transform:translate(840px,0px)}18.75%,100%{opacity:0;transform:translate(840px,0px)}}@media(prefers-reduced-motion:reduce){.packet{display:none;animation:none}}</style><rect width="100%" height="100%" fill="#fff"/><polyline points="130,224 130,304 970,304 970,224" fill="none" stroke="#55746a" stroke-width="2"/><polygon points="970,224 965,233 975,233" fill="#55746a"/><polyline points="220,192 460,192" fill="none" stroke="#55746a" stroke-width="2"/><polygon points="460,192 451,187 451,197" fill="#55746a"/><text x="32" y="40" font-size="24" font-weight="700">하나의 사건을 여러 수신자에게 전파하기</text><rect x="40" y="160" width="180" height="64" rx="8" fill="#edf4f1" stroke="#41685a"/><text x="130" y="198" text-anchor="middle" font-size="18">요청자</text><rect x="460" y="160" width="180" height="64" rx="8" fill="#edf4f1" stroke="#41685a"/><text x="550" y="198" text-anchor="middle" font-size="18">대기열</text><rect x="880" y="160" width="180" height="64" rx="8" fill="#edf4f1" stroke="#41685a"/><text x="970" y="198" text-anchor="middle" font-size="18">작업자</text><text x="32" y="572" font-size="18">1. 요청자 → 대기열: 첫 수신자에게 전파 (0.4–1.4s)</text><text x="32" y="604" font-size="18">2. 요청자 → 작업자: 둘째 수신자에게 전파 (0.4–1.4s)</text><circle class="packet" cx="220" cy="192" r="5" fill="#147c53" style="animation-name:event-a"/><circle class="packet" cx="130" cy="224" r="5" fill="#147c53" style="animation-name:event-b"/></svg>
