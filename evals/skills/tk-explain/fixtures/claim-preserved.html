<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>설명 회귀 자료</title><body><h1>양수를 반복해서 더하면 모든 실수 기준을 넘을 수 있습니다</h1><p>검토하는 명제는 다음과 같습니다. 임의의 실수 a &gt; 0과 실수 M에 대해, n·a &gt; M인 양의 정수 n이 존재합니다.</p><p>이미지의 문장은 실수 범위에서는 참입니다. n을 max(1, ⌊M/a⌋ + 1)로 택하면 됩니다. 이는 실수의 아르키메데스 성질입니다. 제논의 역설에서 이동 거리를 나눌 때처럼 항의 크기가 줄어드는 수렴 급수와 고정된 양수의 반복 합은 구별해야 합니다.</p></body></html>
