name: Validate TigerKit v21.0.7

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'release/v21.0.7'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v21.0.7
          fetch-depth: 0

      - name: Apply zero-crust migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/zero_crust_migrate.py')
          text = path.read_text(encoding='utf-8')

          old = 'pattern.subn(replacement.rstrip() + "\\n\\n", text, count=1)'
          new = 'pattern.subn(lambda _match: replacement.rstrip() + "\\n\\n", text, count=1)'
          if text.count(old) != 2:
              raise SystemExit(f'unexpected replacement runner count: {text.count(old)}')
          text = text.replace(old, new)

          old_block = '''for relative in (
              "skills/tk-browser-verify/SKILL.md",
              "skills/tk-reflect/SKILL.md",
              "skills/tk-drive/SKILL.md",
          ):
              block = re.compile(
                  rf\'''(?ms)        "{re.escape(relative)}": \\(.*?\\n        \\),\\n\'''
              )
              validator, count = block.subn("", validator, count=1)
              if count != 1:
                  raise SystemExit(f"expected one required_text block for {relative}, found {count}")
          '''
          new_block = '''required_start = validator.index("    required_text = {")
          required_end = validator.index(
              "    for relative, needles in required_text.items():",
              required_start,
          )
          required_block = validator[required_start:required_end]
          for relative in (
              "skills/tk-browser-verify/SKILL.md",
              "skills/tk-reflect/SKILL.md",
              "skills/tk-drive/SKILL.md",
          ):
              block = re.compile(
                  rf\'''(?ms)        "{re.escape(relative)}": \\(.*?^        \\),\\n\'''
              )
              required_block, count = block.subn("", required_block, count=1)
              if count != 1:
                  raise SystemExit(
                      f"expected one repository required_text block for {relative}, found {count}"
                  )
          validator = (
              validator[:required_start]
              + required_block
              + validator[required_end:]
          )
          '''
          if text.count(old_block) != 1:
              raise SystemExit('unexpected required_text migration block')
          path.write_text(text.replace(old_block, new_block), encoding='utf-8')
          PY
          python3 scripts/zero_crust_migrate.py

          python3 - <<'PY'
          from pathlib import Path

          tests = Path('scripts/test_validate_skills.py')
          text = tests.read_text(encoding='utf-8')
          if 'import re\n' not in text:
              text = text.replace('import json\n', 'import json\nimport re\n', 1)
          text = text.replace(
              'self.assertIn("`request_user_input`", errors[0])',
              'self.assertIn("request_user_input", errors[0])',
              1,
          )
          tests.write_text(text, encoding='utf-8')

          validator = Path('scripts/validate_skills.py')
          text = validator.read_text(encoding='utf-8')
          old = '(r"conflict.*prevents `Ready`", "conflict gate"),'
          new = '(r"`conflict` disposition prevents `Ready`", "conflict gate"),'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected conflict gate count: {text.count(old)}')
          text = text.replace(old, new)
          text = text.replace(
              'incomplete learning-loop structure',
              'incomplete learning-loop ownership structure',
          )
          validator.write_text(text, encoding='utf-8')
          PY

      - name: Prepare version metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          if text.count('21.0.6') != 4:
              raise SystemExit(f'unexpected README version surface: {text.count("21.0.6")}')
          readme.write_text(text.replace('21.0.6', '21.0.7'), encoding='utf-8')

          validator = Path('scripts/validate_skills.py')
          text = validator.read_text(encoding='utf-8')
          text = text.replace('TigerKit 21.0.6', 'TigerKit 21.0.7')
          validator.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '## Unreleased\n\n'
          entry = (
              '## 21.0.7 — Zero-crust Contracts\n\n'
              '- Replaced validator magic-phrase checks with structural checks for user decisions, terminal output, response language, and learning-loop ownership.\n'
              '- Reduced `tk-browser-verify`, `tk-reflect`, `tk-to-spec`, and `tk-to-tickets` to their unique trigger, authority, evidence, state, and failure contracts.\n'
              '- Preserved browser launch/capture safety, reflection apply authority, Ready traceability, vertical ticket ownership, behavior evals, and package compatibility while reducing eager instruction weight.\n\n'
          )
          if '## 21.0.7 — Zero-crust Contracts' in text:
              raise SystemExit('v21.0.7 changelog entry already exists')
          if text.count(marker) != 1:
              raise SystemExit('unexpected changelog marker')
          changelog.write_text(text.replace(marker, marker + entry, 1), encoding='utf-8')
          PY

      - name: Validate exact candidate
        shell: bash
        run: |
          python3 scripts/validate_skills.py
          python3 scripts/validate_skills.py --links-only
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/sync_eval_compat.py
          npx --yes skills@1.5.9 add . --list
          npx --yes skills add . --list
          git diff --check

      - name: Commit validated release candidate
        shell: bash
        run: |
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f scripts/zero_crust_migrate.py
          rm -f .github/workflows/validate-v21.0.7.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'TigerKit Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'chore(release): prepare v21.0.7'
          git push origin HEAD:release/v21.0.7
