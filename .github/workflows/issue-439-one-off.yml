name: One-off indirect verification for issue 439
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/browser-shared-auth-resource-lifecycle-439]
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run isolated security and auth tests
        run: python3 -B -m unittest discover -s scripts -p 'test_shared_browser_auth.py' -v
      - name: Run all repository tests
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Run full TigerKit release gate
        run: python3 scripts/run_seed_release_gate.py --baseline origin/main --candidate HEAD
