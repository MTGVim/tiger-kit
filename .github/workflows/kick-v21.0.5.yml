name: Kick TigerKit v21.0.5 preparation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  kick:
    if: github.event.pull_request.head.ref == 'release/v21.0.5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply and validate release candidate
        shell: bash
        run: |
          python3 scripts/prepare_v21_0_5.py
          python3 scripts/sync_eval_compat.py
          python3 scripts/validate_skills.py
          python3 scripts/validate_skills.py --links-only
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/sync_eval_compat.py
          git diff --check

      - name: Commit prepared release
        shell: bash
        run: |
          rm -f scripts/prepare_v21_0_5.py
          rm -f .github/workflows/prepare-v21.0.5.yml
          rm -f .github/workflows/kick-v21.0.5.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "TigerKit Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): prepare v21.0.5"
          git push origin HEAD:release/v21.0.5
