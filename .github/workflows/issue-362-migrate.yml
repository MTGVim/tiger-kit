name: issue-362-migrate

on:
  push:
    branches:
      - bot/issue-362-authoring-evals

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build candidate and run local release gate
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git merge-base HEAD origin/main)"
          python3 -m pip install --quiet pyyaml

          # The workflow is only a disposable execution harness. It deletes itself
          # before the candidate commit; TigerKit keeps validation local-only.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/issue_362_migrate.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if 'skill_dir / "evals' in content or "skills/<skill>/evals" in content:\n'''
          new = '''    if 'skill_dir / "evals' in content or re.search(r"(?<!evals/)skills/<skill>/evals", content):\n'''
          if old not in text:
              raise SystemExit('stale-path guard patch target missing')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          python3 .github/issue_362_migrate.py

          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'patch target missing in {path}: {old[:100]!r}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          # Baseline contract comparison treats the physical eval relocation as
          # path-equivalent while still requiring identical assertion semantics.
          replace(
              'scripts/run_skill_evals.py',
              '\ndef _compare_behavior_preservation(\n',
              '''\ndef _canonical_eval_assertion_path(skill: str, value: object) -> object:\n    if isinstance(value, str):\n        return value.replace(\n            f"skills/{skill}/evals/fixtures/",\n            f"evals/skills/{skill}/fixtures/",\n        )\n    if isinstance(value, list):\n        return [_canonical_eval_assertion_path(skill, child) for child in value]\n    if isinstance(value, dict):\n        return {\n            key: _canonical_eval_assertion_path(skill, child)\n            for key, child in value.items()\n        }\n    return value\n\n\ndef _compare_behavior_preservation(\n''',
          )
          replace(
              'scripts/run_skill_evals.py',
              '''            json.dumps(assertion, ensure_ascii=False, sort_keys=True)\n            for assertion in candidate_case.get("assertions", [])\n''',
              '''            json.dumps(\n                _canonical_eval_assertion_path(skill, assertion),\n                ensure_ascii=False,\n                sort_keys=True,\n            )\n            for assertion in candidate_case.get("assertions", [])\n''',
          )
          replace(
              'scripts/run_skill_evals.py',
              '''            fingerprint = json.dumps(assertion, ensure_ascii=False, sort_keys=True)\n''',
              '''            fingerprint = json.dumps(\n                _canonical_eval_assertion_path(skill, assertion),\n                ensure_ascii=False,\n                sort_keys=True,\n            )\n''',
          )

          # Historical baselines still live under skills/*/evals. Language scanning
          # covers both physical layouts, while the comparison normalizes their paths.
          replace(
              'scripts/run_release_gate.py',
              '''    paths.extend(sorted(root.glob("evals/skills/tk-*/*.json")))\n''',
              '''    paths.extend(sorted(root.glob("skills/tk-*/evals/*.json")))\n    paths.extend(sorted(root.glob("evals/skills/tk-*/*.json")))\n''',
          )

          # The seed-first release gate is the documented pre-main gate and must be
          # able to compare this one-time migration against the historical baseline.
          replace(
              'scripts/run_seed_release_gate.py',
              '''        baseline_contracts = load_eval_contracts(baseline_root, None)\n        candidate_contracts = load_eval_contracts(candidate_root, None)\n''',
              '''        baseline_contracts = load_eval_contracts(\n            baseline_root, None, allow_legacy_skill_local=True\n        )\n        candidate_contracts = load_eval_contracts(candidate_root, None)\n''',
          )

          # Focused loader regression test uses the imported function directly.
          replace(
              'scripts/test_run_skill_evals.py',
              '''        evaluate_checkout,\n        parse_diagnostic_output,\n''',
              '''        evaluate_checkout,\n        load_eval_contracts,\n        parse_diagnostic_output,\n''',
          )
          replace(
              'scripts/test_run_skill_evals.py',
              'run_skill_evals.load_eval_contracts',
              'load_eval_contracts',
          )

          # Make the publication rule explicit: local release-gate Pass, not CI green.
          agents = Path('AGENTS.md')
          text = agents.read_text(encoding='utf-8')
          marker = '''python3 scripts/run_seed_release_gate.py \\\n  --baseline "$(git rev-parse origin/main)" \\\n  --candidate HEAD \\\n  --output /tmp/tigerkit-release-gate\n```\n\n모든 `validation`은 `local-only`입니다.\n'''
          replacement = '''python3 scripts/run_seed_release_gate.py \\\n  --baseline "$(git rev-parse origin/main)" \\\n  --candidate HEAD \\\n  --output /tmp/tigerkit-release-gate\n```\n\n### `main` 푸시 전 체크리스트\n\n- [ ] `origin/main`을 다시 확인하고 비교 기준이 최신인지 확인합니다.\n- [ ] 후보 변경을 모두 커밋하고 작업 트리가 깨끗한지 확인합니다.\n- [ ] 위의 필수 검사를 모두 통과합니다.\n- [ ] `run_seed_release_gate.py`를 최신 `origin/main` 기준으로 실행하고 최종 `status`가 `Pass`인지 확인합니다.\n- [ ] `blocking_reasons`, `contract_errors`, `Unverifiable` 상태가 남아 있지 않은지 확인합니다.\n- [ ] 검증 뒤 `origin/main`이 이동했다면 새 기준으로 릴리즈 게이트를 다시 실행합니다.\n- [ ] 이 체크리스트를 만족한 뒤에만 `main`을 갱신합니다. GitHub Actions나 다른 CI 성공은 이 체크를 대체하지 않습니다.\n\n모든 `validation`은 `local-only`입니다. 저장소에 GitHub Actions `validation`을 추가하지 않습니다.\n'''
          if marker not in text:
              raise SystemExit('AGENTS release-gate block missing')
          agents.write_text(text.replace(marker, replacement), encoding='utf-8')
          PY

          rm .github/issue_362_migrate.py .github/workflows/issue-362-migrate.yml
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep authoring eval assets out of skill packages"

          OUT="$(mktemp -d)"
          python3 scripts/run_seed_release_gate.py \
            --baseline "$BASE_SHA" \
            --candidate HEAD \
            --output "$OUT"

          git push origin HEAD:bot/issue-362-authoring-evals
