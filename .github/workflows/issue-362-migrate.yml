name: issue-362-migrate

on:
  push:
    branches:
      - bot/issue-362-authoring-evals

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Migrate and verify
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git merge-base HEAD origin/main)"
          python3 -m pip install --quiet pyyaml
          python3 .github/issue_362_migrate.py
          rm .github/issue_362_migrate.py .github/workflows/issue-362-migrate.yml
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep authoring eval assets out of skill packages"
          OUT="$(mktemp -d)"
          python3 scripts/run_release_gate.py --baseline "$BASE_SHA" --candidate HEAD --output "$OUT"
          git push origin HEAD:bot/issue-362-authoring-evals
