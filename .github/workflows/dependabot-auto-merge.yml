name: Dependabot security auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository && github.repository == 'MTGVim/tiger-kit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # This privileged job only reads verified metadata; it never checks out PR code.
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        id: metadata
      - name: Keep non-patch updates for manual review
        if: steps.metadata.outputs.update-type != 'version-update:semver-patch'
        run: gh pr merge --disable-auto "$PR_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
      - name: Enable auto-merge after required checks
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --merge --match-head-commit "$PR_SHA" "$PR_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
