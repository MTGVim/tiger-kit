name: Temporary TigerKit release gate
on:
  push:
    branches: [fix/browser-cross-platform-server-lock]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release gate
        run: python3 scripts/run_seed_release_gate.py --baseline origin/main --candidate HEAD
