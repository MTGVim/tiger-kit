name: Dependency checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Dependency checks
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 skills/tk-setup-skills/scripts/skill_dependencies.py validate --root . --catalog skills/tk-setup-skills/references/install-catalog.json
      - run: python3 -m compileall -q skills
      - run: for f in skills/*/scripts/*.mjs; do node --check "$f" || exit; done
